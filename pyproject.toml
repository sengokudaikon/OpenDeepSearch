[project]
name = "OpenDeepSearch"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    { name = "Salaheddin Alzu'bi", email = "salaheddinalzubi@gmail.com" },
]

dependencies = ["openai>=1.66.2", "datasets>=3.3.2", "transformers>=4.49.0", "litellm>=1.61.20", "langchain>=0.3.19", "crawl4ai @ git+https://github.com/salzubi401/crawl4ai.git@main", "fasttext-wheel>=0.9.2", "wikipedia-api>=0.8.1", "pillow>=10.4.0", "loguru", "nest_asyncio", "pydantic==2.10.6", "torch","smolagents>=1.9.2"]
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "uv>=0.1.30",
]

demo = [
    "gradio==5.20.1",
]

eval = [
    "tabulate>=0.9.0",
]
scripts = [
    "gradio==5.20.1",
    "tabulate>=0.9.0",
]

all = [
    "gradio==5.20.1",
    "tabulate>=0.9.0",
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "uv>=0.1.30",
]

[tool.hatch.metadata]
allow-direct-references = true
