
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenDeepSearch Web Demo</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        .search-container {
            margin-bottom: 20px;
        }
        input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .results {
            margin-top: 20px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            min-height: 200px;
        }
        .stream-output {
            white-space: pre-wrap;
        }
        .thought-process {
            border-left: 3px solid #3498db;
            padding-left: 10px;
            margin: 10px 0;
            color: #555;
        }
        .final-answer {
            font-weight: bold;
            margin-top: 20px;
        }
        .source-list {
            margin-top: 10px;
        }
        .source-item {
            margin-bottom: 5px;
        }
        .loading-indicator {
            display: none;
            color: #3498db;
            margin: 10px 0;
        }
        .htmx-request .loading-indicator {
            display: block;
        }
    </style>
</head>
<body>
    <h1>OpenDeepSearch Web Demo</h1>
    <p>Ask a question and see the streaming search results</p>

    <div class="search-container">
        <form hx-post="/search"
              hx-target="#search-results"
              hx-trigger="submit"
              hx-swap="innerHTML"
              hx-indicator=".loading-indicator">
            <input type="text" name="query" placeholder="Enter your question..." required>
            <button type="submit">Search</button>
        </form>
        <div class="loading-indicator">Searching... Please wait</div>
    </div>

    <div id="search-results" class="results">
        <p>Results will appear here...</p>
    </div>

</body>
</html>
